<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5b5fef">
<title>یونیمیت</title>
<style>
@font-face{font-family:V;src:url(/panel/fonts/Vazirmatn-Regular.ttf);font-weight:400}
@font-face{font-family:V;src:url(/panel/fonts/Vazirmatn-Bold.ttf);font-weight:700}
:root{--bg:#f4f5fb;--card:#fff;--tx:#1b1d2e;--mu:#7a7f99;--bd:#e6e8f3;--p:#5b5fef;--p2:#8b5cf6;--ok:#12b76a;--er:#f04438;--am:#f59e0b;--sh:0 8px 30px rgba(60,64,140,.10);--g:linear-gradient(135deg,#5b5fef,#8b5cf6)}
@media(prefers-color-scheme:dark){:root{--bg:#0d0f1d;--card:#171a2e;--tx:#eceefb;--mu:#8e93b3;--bd:#262a45;--sh:0 8px 30px rgba(0,0,0,.35)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:400 15px/1.75 V,Tahoma,sans-serif;min-height:100vh;padding-bottom:92px}
body:before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(520px 320px at 85% -5%,rgba(91,95,239,.25),transparent),radial-gradient(420px 300px at 0% 30%,rgba(139,92,246,.16),transparent)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
mark{background:rgba(245,158,11,.35);color:inherit;border-radius:4px;padding:0 2px}
.wrap{max-width:780px;margin:0 auto;padding:18px 16px}
.hero{background:var(--g);color:#fff;border-radius:26px;padding:22px;box-shadow:0 14px 40px rgba(91,95,239,.35);position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;left:-40px;bottom:-60px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero h1{margin:0 0 2px;font-size:22px}.hero p{margin:0;opacity:.88;font-size:13px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;position:relative;z-index:1}
.chip{background:rgba(255,255,255,.2);backdrop-filter:blur(6px);border-radius:99px;padding:5px 12px;font-size:12.5px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;box-shadow:var(--sh)}
.pad{padding:16px}
.row{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--bd);width:100%;text-align:right}
.row:last-child{border:0}button.row:active{background:rgba(91,95,239,.07)}
.ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:21px;background:rgba(91,95,239,.12);flex:none}
.grow{flex:1;min-width:0}.t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.s{color:var(--mu);font-size:12.5px}
.badge{font-size:11.5px;border-radius:99px;padding:2px 9px;background:rgba(18,183,106,.14);color:var(--ok);flex:none}
.badge.bad{background:rgba(240,68,56,.13);color:var(--er)}.badge.mid{background:rgba(245,158,11,.15);color:var(--am)}
h2{font-size:16px;margin:22px 4px 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.btn{background:var(--g);color:#fff;border-radius:14px;padding:11px 18px;font-weight:700;box-shadow:0 8px 20px rgba(91,95,239,.3);transition:.15s}
.btn:active{transform:scale(.96)}.btn.ghost{background:rgba(91,95,239,.12);color:var(--p);box-shadow:none}.btn.sm{padding:7px 12px;font-size:13px}.btn.red{background:rgba(240,68,56,.12);color:var(--er);box-shadow:none}.btn.ok{background:rgba(18,183,106,.15);color:var(--ok);box-shadow:none}
.drop{border:2px dashed var(--bd);border-radius:20px;padding:20px;text-align:center;color:var(--mu);margin-top:14px;transition:.2s;background:var(--card)}
.drop.on{border-color:var(--p);background:rgba(91,95,239,.08)}
.bar{height:8px;border-radius:9px;background:var(--bd);overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;width:0;background:var(--g);border-radius:9px;transition:width .3s}
.nav{position:fixed;bottom:0;inset-inline:0;display:flex;justify-content:center;gap:4px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--card);background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--bd);z-index:5}
.nav button{flex:1;max-width:190px;border-radius:14px;padding:7px 4px;font-size:12px;color:var(--mu);display:grid;justify-items:center;position:relative;line-height:1.5}
.nav button b{font-size:20px;font-weight:400}.nav .on{color:var(--p);background:rgba(91,95,239,.12);font-weight:700}
.dot{position:absolute;top:2px;inset-inline-end:22%;background:var(--er);color:#fff;border-radius:99px;font-size:10.5px;min-width:18px;height:18px;line-height:18px;padding:0 5px}
.sheet{position:fixed;inset:0;background:rgba(10,12,30,.5);z-index:10;display:flex;align-items:flex-end;justify-content:center;animation:f .2s}
.sheet>div{background:var(--card);width:100%;max-width:780px;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:20px;animation:u .28s cubic-bezier(.2,.9,.3,1)}
@keyframes u{from{transform:translateY(60px);opacity:0}}@keyframes f{from{opacity:0}}
.full>div{max-height:none;height:100%;border-radius:0}
@media(min-width:900px){.sheet{align-items:center}.sheet>div{border-radius:26px;max-height:86vh}.full>div{border-radius:0;max-height:none}}
.read h3{font-size:19px;margin:22px 0 6px;color:var(--p)}.read h4{font-size:16px;margin:16px 0 4px}.read p{margin:8px 0}.read li{margin:5px 0}
.ex{background:rgba(245,158,11,.14);border-inline-start:4px solid var(--am);padding:9px 12px;border-radius:10px;margin:10px 0}
.warn{background:rgba(240,68,56,.10);border-inline-start:4px solid var(--er);padding:9px 12px;border-radius:10px;margin:12px 0;font-size:13.5px}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:14px;z-index:30;box-shadow:var(--sh);max-width:90vw;text-align:center}
.job{margin-top:14px;padding:14px 16px}.gate{min-height:80vh;display:grid;place-items:center;text-align:center;padding:24px}
.gate .logo{width:84px;height:84px;border-radius:26px;background:var(--g);display:grid;place-items:center;font-size:42px;margin:0 auto 18px;box-shadow:0 14px 40px rgba(91,95,239,.4)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.course{padding:16px;border-radius:20px;text-align:right;color:#fff;min-height:104px;position:relative;box-shadow:var(--sh)}
.course b{display:block;font-size:16px}.course span{font-size:12.5px;opacity:.9}.course em{position:absolute;left:12px;top:10px;font-style:normal}
.sk{height:64px;border-radius:16px;margin-bottom:10px;background:linear-gradient(90deg,var(--bd),transparent,var(--bd));background-size:200% 100%;animation:s 1.2s infinite}@keyframes s{to{background-position:-200% 0}}
.flex{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=text],input[type=number],input[type=datetime-local],textarea{width:100%;padding:12px;border-radius:14px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit}
textarea{min-height:140px;resize:vertical}
.empty{text-align:center;color:var(--mu);padding:34px 10px}.empty b{font-size:40px;display:block}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}
.tile{background:var(--bg);border:1px solid var(--bd);border-radius:16px;padding:11px 12px;text-align:right;display:flex;gap:10px;align-items:center;transition:.15s;font-weight:700;font-size:14px}
.tile:active{transform:scale(.97)}.tile span{font-size:22px}.tile.on{border-color:var(--p);background:rgba(91,95,239,.10)}
.bubble{max-width:86%;padding:10px 13px;border-radius:16px;margin:8px 0;white-space:pre-wrap;word-break:break-word}
.bubble.me{background:var(--g);color:#fff;margin-inline-start:auto;border-end-end-radius:4px}.bubble.bot{background:var(--bg);border:1px solid var(--bd);border-end-start-radius:4px}
.opt{display:block;width:100%;text-align:right;padding:11px 13px;border-radius:12px;border:1px solid var(--bd);margin:6px 0;background:var(--bg)}
.opt.ok{background:rgba(18,183,106,.16);border-color:var(--ok)}.opt.no{background:rgba(240,68,56,.12);border-color:var(--er)}
.fcard{padding:14px;margin-top:10px}.fcard .a{color:var(--mu);margin-top:6px;border-top:1px dashed var(--bd);padding-top:6px}
.rv{min-height:42vh;display:grid;place-items:center;text-align:center;padding:26px;font-size:21px;font-weight:700}.rv small{display:block;font-weight:400;color:var(--mu);font-size:13px;margin-bottom:10px}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.rate .btn{box-shadow:none;padding:12px 4px;font-size:13.5px}
.chipb{padding:7px 14px;border-radius:99px;background:rgba(91,95,239,.1);color:var(--p);font-size:13px}.chipb.on{background:var(--g);color:#fff}
.plan{padding:14px;margin-top:10px}.plan b{color:var(--p)}.plan ul{margin:6px 0 0;padding-inline-start:20px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s),T=()=>localStorage.getItem('ut');
const COL=['#5b5fef,#8b5cf6','#0ea5a4,#22c55e','#f97316,#ef4444','#ec4899,#8b5cf6','#0284c7,#6366f1','#d97706,#f59e0b'];
const S={tab:'files',notes:null,courses:null,me:null,pm:null,job:null,course:null,items:null,due:0,rem:null,rv:null,sig:'',tick:0};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fa=n=>Number(n).toLocaleString('fa-IR');
function toast(m){const e=document.createElement('div');e.className='toast';e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),3400)}
async function api(p,o={}){const h={Authorization:'Bearer '+T(),...(o.json?{'Content-Type':'application/json'}:{})};
 const r=await fetch(p,{method:o.method||'GET',headers:h,body:o.json?JSON.stringify(o.json):undefined});
 if(r.status===401){localStorage.removeItem('ut');gate();throw 0}
 if(!r.ok){let d='خطایی پیش اومد';try{const j=await r.json();d=j.detail||d}catch(e){}throw new Error(typeof d==='string'?d:'خطایی پیش اومد')}
 return o.raw?r:r.json()}
const guard=async(f)=>{try{return await f()}catch(e){if(e)toast(e.message||'خطایی پیش اومد')}};
async function dl(p,name,o={}){await guard(async()=>{const r=await api(p,{raw:1,...o}),b=await r.blob(),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();toast('فایل آماده شد')})}
const ico=n=>/\.(ogg|oga|mp3|m4a|wav|aac|opus|flac)$/i.test(n)?'🎙':/\.pdf$/i.test(n)?'📄':/\.pptx?$/i.test(n)?'📊':/\.(jpe?g|png|webp)$/i.test(n)?'🖼':'📝';
const QW={poor:'⚠️ کیفیت تبدیل صدا به متن خیلی پایین بود؛ متن احتمالاً پر از کلمه‌ی غلطه و خلاصه یا جزوه‌ی ساخته‌شده ازش هم غلط می‌شه. اول «📄 متن کامل» رو ببین. ضبط نزدیک‌تر به استاد و بدون نویز نتیجه‌ی بهتری می‌ده.',fair:'⚠️ کیفیت صدا متوسط بود؛ ممکنه بعضی کلمه‌ها غلط باشن.'};
const sz=b=>b>1e6?Number((b/1e6).toFixed(1)).toLocaleString('fa-IR')+' مگابایت':fa(Math.max(1,Math.round(b/1e3)))+' کیلوبایت';
const ago=d=>{const s=(Date.now()-new Date(d))/1e3;return s<90?'همین الان':s<3600?fa(Math.round(s/60))+' دقیقه پیش':s<86400?fa(Math.round(s/3600))+' ساعت پیش':fa(Math.round(s/86400))+' روز پیش'};
function md(t){let o='',ul=0;for(const l of String(t).split('\n')){const x=l.trim();if(!x)continue;
 const li=x.match(/^[-*•]\s+(.*)/);if(li){if(!ul){o+='<ul>';ul=1}o+='<li>'+esc(li[1].replace(/\*\*/g,''))+'</li>';continue}if(ul){o+='</ul>';ul=0}
 const h=x.match(/^(#{1,6})\s*(.*)/);if(h)o+=h[1].length<3?'<h3>'+esc(h[2])+'</h3>':'<h4>'+esc(h[2])+'</h4>';
 else if(x.startsWith('⭐'))o+='<div class="ex">'+esc(x.replace(/\*\*/g,''))+'</div>';else o+='<p>'+esc(x.replace(/\*\*/g,''))+'</p>'}
 return o+(ul?'</ul>':'')}
function sheet(html,full){const s=document.createElement('div');s.className='sheet'+(full?' full':'');s.innerHTML='<div>'+html+'</div>';
 s.onclick=e=>{if(e.target===s)s.remove()};document.body.appendChild(s);s.close=()=>s.remove();return s}
function gate(){$('#app').innerHTML=`<div class="gate"><div><div class="logo">🎓</div><h1>یونیمیت</h1><p style="color:var(--mu)">دستیار هوشمند درس و جزوه‌ی تو<br>برای ورود، تو ربات دکمه‌ی <b>«🌐 وب‌اپ»</b> رو بزن.</p><p class="s">⚠️ وب‌اپ بدون VPN باز نمی‌شه.</p></div></div>`}
async function boot(){const c=new URLSearchParams(location.search).get('code');
 if(c){try{const r=await fetch('/panel/exchange',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:c})});
  if(r.ok)localStorage.setItem('ut',(await r.json()).access_token);else toast('لینک ورود منقضی شده؛ از ربات دوباره بگیر')}catch(e){}history.replaceState(null,'',location.pathname)}
 if(!T())return gate();render();await load();
 setInterval(()=>{if(document.hidden||!T())return;jobs();if(++S.tick%5===0)load(1)},6000);
 document.addEventListener('visibilitychange',()=>{if(!document.hidden&&T())load(1)})}
const busy=()=>document.querySelector('.sheet')||[...document.querySelectorAll('#v input,#v textarea')].some(i=>i.value);
async function load(quiet){try{const[n,c,m,d,r,pm]=await Promise.all([api('/notes/'),api('/jozve/courses'),api('/auth/me'),api('/flashcards/due-count'),api('/reminders'),api('/panel/me')]);
 const sig=JSON.stringify([n,c,m,d,r,pm]);S.notes=n;S.courses=c;S.me=m;S.due=d.due_count||0;S.rem=r;S.pm=pm;await jobs(1);
 if(quiet){if(sig===S.sig||busy())return}S.sig=sig;render()}catch(e){if(e)toast(e.message)}}
async function jobs(q){try{const{job}=await api('/jozve/jobs/running'),was=S.job;S.job=job;if(was&&!job){toast('✅ جزوه‌ی کامل آماده شد');load(1)}else if(!q&&JSON.stringify(was)!==JSON.stringify(job))render()}catch(e){}}
function render(){const m=S.me,tabs=[['files','📂','فایل‌ها'],['book','📒','جزوه‌ها'],['review','🧠','مرور'],['more','⚙️','بیشتر']];
 const job=S.job?`<div class="card job"><b>⏳ در حال ساخت جزوه‌ی کامل</b><div class="s">بخش ${fa(S.job.done_parts)} از ${fa(S.job.total_parts)}</div><div class="bar"><i style="width:${Math.round(S.job.done_parts/Math.max(1,S.job.total_parts)*100)}%"></i></div></div>`:'';
 const focus=S.tab==='review'&&S.rv&&S.rv.i<S.rv.cards.length;
 $('#app').innerHTML=`<div class="wrap">${focus?'':`<div class="hero"><h1>سلام 👋 امروز چی بخونیم؟</h1><p>فایل‌ها و جزوه‌هات با ربات هماهنگن</p><div class="chips">${m?`<span class="chip">⚡ امروز: ${fa(m.daily_remaining)} از ${fa(m.daily_total)}</span><span class="chip">💎 اعتبار: ${fa(m.credits)}</span>${m.plan==='premium'?'<span class="chip">👑 پریمیوم</span>':''}`:'<span class="chip">…</span>'}</div></div>${job}`}<div id="v"></div></div>
 <div class="nav">${tabs.map(t=>`<button class="${S.tab===t[0]?'on':''}" onclick="go('${t[0]}')">${t[0]==='review'&&S.due?`<i class="dot">${fa(S.due)}</i>`:''}<b>${t[1]}</b>${t[2]}</button>`).join('')}</div>`;
 ({files:vFiles,book:()=>S.course?vCourse():vBook(),review:vReview,more:vMore})[S.tab]()}
function go(t){S.tab=t;S.course=null;render();window.scrollTo(0,0)}

/* ---------- فایل‌ها ---------- */
function vFiles(){const n=S.notes;$('#v').innerHTML=`<div class="drop" id="dz"><div style="font-size:34px">☁️</div><b style="color:var(--tx)">فایل رو اینجا بنداز یا انتخاب کن</b><div class="s">صوت، PDF، پاورپوینت، عکس — تا ۳۰ مگابایت</div><div id="up"></div><p class="flex" style="justify-content:center"><button class="btn" onclick="$('#fi').click()">انتخاب فایل</button><button class="btn ghost sm" onclick="newText()">✍️ متن جدید</button><button class="btn ghost sm" onclick="gsearch()">🔍 جستجو</button></p><input id="fi" type="file" hidden></div>
<h2>فایل‌های من</h2>${!n?'<div class="sk"></div><div class="sk"></div>':!n.length?'<div class="empty"><b>🗂</b>هنوز فایلی نداری</div>':'<div class="card">'+n.map((x,i)=>`<button class="row" onclick="openFile(${i})"><span class="ic">${ico(x.original_filename)}</span><span class="grow"><div class="t">${esc(x.original_filename)}</div><div class="s">${sz(x.size_bytes)} · ${ago(x.created_at)}</div></span><span class="badge ${x.processing_status==='failed'||x.transcript_quality==='poor'?'bad':x.processing_status==='done'&&x.transcript_quality!=='fair'?'':'mid'}">${x.processing_status==='done'&&x.transcript_quality==='poor'?'کیفیت پایین':x.processing_status==='done'&&x.transcript_quality==='fair'?'کیفیت متوسط':{done:'آماده',failed:'ناموفق',not_supported:'بدون متن'}[x.processing_status]||x.processing_status}</span></button>`).join('')+'</div>'}`;
 const dz=$('#dz');['dragover','dragenter'].forEach(e=>dz.addEventListener(e,x=>{x.preventDefault();dz.classList.add('on')}));['dragleave','drop'].forEach(e=>dz.addEventListener(e,x=>{x.preventDefault();dz.classList.remove('on')}));
 dz.addEventListener('drop',x=>up(x.dataTransfer.files[0]));$('#fi').onchange=e=>up(e.target.files[0])}
function up(f){if(!f)return;const au=/\.(ogg|oga|mp3|m4a|wav|aac|opus|flac)$/i.test(f.name);
 if(f.size>30e6)return toast('حجم فایل بیشتر از ۳۰ مگابایته');
 const fd=new FormData(),x=new XMLHttpRequest(),b=$('#up');fd.append('file',f);b.innerHTML='<div class="bar"><i id="pb"></i></div><div class="s" id="pt">در حال آپلود…</div>';
 const ac=(S.courses||[]).find(c=>c.is_active);x.open('POST','/notes/upload'+(au&&ac?'?hint='+encodeURIComponent(ac.name):''));x.setRequestHeader('Authorization','Bearer '+T());
 x.upload.onprogress=e=>{const p=Math.round(e.loaded/e.total*100);$('#pb').style.width=p+'%';if(p>=100)$('#pt').textContent=au?'در حال تبدیل صدا به متن… (ممکنه چند دقیقه طول بکشه)':'در حال پردازش…'};
 x.onload=async()=>{if(x.status===200){toast('✅ فایل آماده شد');await load();openFile(0)}else{let d='آپلود ناموفق بود';try{d=JSON.parse(x.responseText).detail||d}catch(e){}toast(d);render()}};x.onerror=()=>{toast('اتصال قطع شد');render()};x.send(fd)}
function newText(){const s=sheet(`<h2 style="margin-top:0">✍️ متن جدید</h2><p class="s">متنت رو بچسبون تا مثل یه فایل باهاش کار کنی (خلاصه، سؤال، فلش‌کارت…).</p><textarea id="nt" placeholder="متن اینجا…"></textarea><p><button class="btn" id="ntb">ساخت</button></p>`);
 s.querySelector('#ntb').onclick=()=>guard(async()=>{const v=s.querySelector('#nt').value.trim();if(!v)return toast('متن خالیه');await api('/notes/from-text',{method:'POST',json:{text:v}});s.close();toast('✅ ساخته شد');await load();openFile(0)})}
function gsearch(){const s=sheet(`<h2 style="margin-top:0">🔍 جستجو بین فایل‌ها</h2><div class="flex"><input type="text" id="q" placeholder="یه عبارت یا موضوع…" style="flex:1"><button class="btn" id="qb">جستجو</button></div><div id="qr"></div>`);
 const run=()=>guard(async()=>{const q=s.querySelector('#q').value.trim();if(!q)return;const o=s.querySelector('#qr');o.innerHTML='<div class="sk" style="margin-top:12px"></div>';
  const{results}=await api('/notes/search',{method:'POST',json:{query:q}});

function quiz(o,qs){if(!qs.length){o.innerHTML='<div class="empty">سؤالی ساخته نشد</div>';return}let ok=0,dn=0;
 o.innerHTML=qs.map((q,i)=>`<div class="card pad" style="margin-top:12px"><b>${fa(i+1)}. ${esc(q.question)}</b>${(q.options||[]).map((t,j)=>`<button class="opt" data-q="${i}" data-o="${j}">${esc(t)}</button>`).join('')}</div>`).join('')+'<div class="s" id="qs" style="margin:10px 4px"></div>';
 o.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const g=o.querySelectorAll('.opt[data-q="'+b.dataset.q+'"]');if(g[0].dataset.d)return;g.forEach(x=>x.dataset.d=1);const c=+qs[b.dataset.q].correct_index;if(g[c])g[c].classList.add('ok');if(+b.dataset.o===c)ok++;else b.classList.add('no');dn++;o.querySelector('#qs').textContent=`${fa(ok)} درست از ${fa(dn)} پاسخ`})}

 const cb=o.querySelector('#cb'),ci=o.querySelector('#ci'),add=(c,t)=>{const d=document.createElement('div');d.className='bubble '+c;d.textContent=t;cb.appendChild(d);cb.scrollTop=cb.scrollHeight;return d};

 <div style="margin-top:10px">💎 اعتبار همیشگی: <b>${fa(m.credits)}</b></div><div class="s">👥 ${fa(m.referral_count||0)} نفر دعوت کردی — لینک دعوت رو از دکمه‌ی «🎁 دعوت از دوستان» تو ربات بگیر.</div>`:'<div class="sk"></div>'}</div>
 <h2>🎟 کد هدیه</h2><div class="card pad flex" style="flex-wrap:nowrap"><input type="text" id="rc" placeholder="UM-XXXX-XXXX" dir="ltr" style="flex:1"><button class="btn" id="rb">فعال‌سازی</button></div>
 <h2>⏰ یادآور</h2><div class="card pad">${pm.chat_id?`<input type="text" id="rm" placeholder="چی رو یادم بندازم؟"><div class="flex" style="margin:10px 0">${[['۳۰ دقیقه‌ی دیگه',30],['۱ ساعت دیگه',60],['۳ ساعت دیگه',180],['فردا',1440]].map(a=>`<button class="chipb" data-m="${a[1]}">${a[0]}</button>`).join('')}</div><input type="datetime-local" id="rd2"><p><button class="btn" id="ra">افزودن یادآور</button></p><div class="s">یادآور تو همون ربات (${pm.platform==='bale'?'بله':'تلگرام'}) برات فرستاده می‌شه.</div>`:'<div class="s">یادآور فقط برای حساب‌هایی کار می‌کنه که از ربات وارد شدن.</div>'}</div>
 ${R&&R.length?'<div class="card" style="margin-top:12px">'+R.map(r=>`<div class="row"><span class="ic">⏰</span><span class="grow"><div class="t">${esc(r.message)}</div><div class="s">${new Date(r.remind_at+'Z').toLocaleString('fa-IR')}</div></span></div>`).join('')+'</div>':''}
 <h2>🔐 خروج</h2><div class="card pad"><p class="s" style="margin-top:0">فایل‌ها و جزوه‌هات تو ربات و دیتابیس می‌مونن. برای ورود دوباره، تو ربات دکمه‌ی «🌐 وب‌اپ» رو بزن.</p><button class="btn red sm" onclick="localStorage.removeItem('ut');S.rv=null;gate()">خروج از وب‌اپ</button></div>`;
 const rb=$('#rb');if(rb)rb.onclick=()=>guard(async()=>{const c=$('#rc').value.trim();if(!c)return;const r=await api('/redeem',{method:'POST',json:{code:c}});toast('✅ '+(r.message||'کد فعال شد'));$('#rc').value='';S.sig='';load()});
 document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{RT=Date.now()+(+b.dataset.m)*60000;document.querySelectorAll('[data-m]').forEach(x=>x.classList.toggle('on',x===b));$('#rd2').value=''});
 const ra=$('#ra');if(ra)ra.onclick=()=>guard(async()=>{const msg=$('#rm').value.trim(),dv=$('#rd2').value;const at=dv?new Date(dv).getTime():RT;if(!msg)return toast('متن یادآور رو بنویس');if(!at||at<=Date.now())return toast('یه زمان در آینده انتخاب کن');
  await api('/reminders',{method:'POST',json:{chat_id:String(pm.chat_id),message:msg,remind_at:new Date(at).toISOString().slice(0,19)}});RT=null;toast('✅ یادآور تنظیم شد');S.sig='';load()})}
boot();
</script>
</body>
</html>
